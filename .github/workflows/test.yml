name: e2e tests

run-name: "#${{ github.run_number }} e2e (${{ github.head_ref || github.ref_name }}) by ${{ github.actor }}"
on:
  pull_request:
    types: [opened, labeled, unlabeled, synchronize]

  workflow_dispatch:
    inputs:
        run_tests:
          description: 'Запустить тесты'
          required: true
          type: boolean
          default: true
env:
  DOTNET_VERSION: 8
  GITHUB_PAT: ${{ secrets.SERVICE_ACCOUNT_TOKEN }}
  PYTHON_VERSION: 3.12
  TEMP_FILE: tmp/output.txt
  TMS_ADAPTER_MODE: 1
  TMS_CERT_VALIDATION: false
  TMS_PRIVATE_TOKEN: ${{ secrets.TESTIT_PRIVATE_TOKEN }}
  TMS_URL: ${{ secrets.TESTIT_URL }}
  TMS_CONFIG_FILE: ${{ github.workspace }}/tms.config.json
  TMS_OVERWRITE_EXPECTED: false
  ADAPTERS_SWIFT_PATH: ${{ github.workspace }}
jobs:
  test:
    name: ${{ matrix.project_name }}
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration_id: XCTEST_CONFIGURATION_ID
            project_id: XCTEST_PROJECT_ID
            project_name: xctest
    env:
      TMS_CONFIGURATION_ID: ${{ secrets[matrix.configuration_id] }}
      TMS_PROJECT_ID: ${{ secrets[matrix.project_id] }}
      TMS_TEST_RUN_NAME: ${{ matrix.project_name }} TestRun
    steps:
      - name: Checkout adapters-swift (current branch / PR head)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          path: adapters-swift

      - name: Checkout api-validator-dotnet
        uses: actions/checkout@v4
        with:
          repository: testit-tms/api-validator-dotnet
          token: ${{ env.GITHUB_PAT }}
          path: api-validator-dotnet

      - name: Checkout swift-examples
        uses: actions/checkout@v4
        with:
          repository: testit-tms/swift-examples
          path: swift-examples

      - name: Verify adapters-swift revision
        working-directory: adapters-swift
        run: |
          echo "ADAPTERS_SWIFT_SHA=$(git rev-parse HEAD)"
          echo "ADAPTERS_SWIFT_REF=$(git rev-parse --abbrev-ref HEAD)"
          swift build -v

      - name: Link local adapters-swift into swift-examples
        env:
          DERIVED_DATA_PATH: ${{ github.workspace }}/.derivedData
        run: |
          chmod +x adapters-swift/.github/scripts/use-local-adapters-swift.sh
          adapters-swift/.github/scripts/use-local-adapters-swift.sh \
            "${{ github.workspace }}/adapters-swift" \
            "${{ github.workspace }}/swift-examples"

          rm -rf "${DERIVED_DATA_PATH}"
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf ~/Library/org.swift.swiftpm

          xcodebuild -resolvePackageDependencies \
            -project swift-examples/examples-swift.xcodeproj \
            -scheme tests \
            -destination 'platform=macOS' \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            2>&1 | tee resolve-packages.log

          echo "--- Resolved packages ---"
          sed -n '/Resolved source packages:/,$p' resolve-packages.log | head -20

          if grep -q 'testit-tms/adapters-swift' resolve-packages.log; then
            echo "ERROR: xcodebuild still resolved remote adapters-swift from GitHub." >&2
            exit 1
          fi

          if grep -q 'testit-api-client' resolve-packages.log; then
            echo "ERROR: transitive testit-api-client means published adapters-swift was used." >&2
            exit 1
          fi

      - name: Setup environment
        run: |
          dotnet build --configuration Debug --property WarningLevel=0 api-validator-dotnet
          pip install testit-cli

      - name: Create TestRun
        run: |
          testit testrun create --token ${{ env.TMS_PRIVATE_TOKEN }} --output ${{ env.TEMP_FILE }}
          echo "TMS_TEST_RUN_ID=$(<${{ env.TEMP_FILE }})" >> $GITHUB_ENV

      - name: Test
        env:
          DERIVED_DATA_PATH: ${{ github.workspace }}/.derivedData
        run: |
          export SYNC_STORAGE_VERSION=$(grep -o 'syncStorageReleaseVersion = "[^"]*"' adapters-swift/Sources/SyncStorage/SyncStorageRunner.swift | cut -d'"' -f2)
          export TMS_SYNC_STORAGE_VERBOSE=true

          mkdir -p .caches
          wget -O .caches/syncstorage-darwin-arm64 \
          "https://github.com/testit-tms/sync-storage-public/releases/download/${SYNC_STORAGE_VERSION}/syncstorage-${SYNC_STORAGE_VERSION}-darwin_arm64"
          chmod +x .caches/syncstorage-darwin-arm64
          nohup .caches/syncstorage-darwin-arm64 --testRunId ${{ env.TMS_TEST_RUN_ID }} --port 49152 \
          --baseURL ${{ env.TMS_URL }} --privateToken ${{ env.TMS_PRIVATE_TOKEN }}  > service.log 2>&1 & 
          
          sleep 1
          
          curl -v http://127.0.0.1:49152/health || true

          cd swift-examples
          cat > tests/testit.properties << EOF
          url=${{ env.TMS_URL }}
          privateToken=${{ env.TMS_PRIVATE_TOKEN }}
          projectId=${{ env.TMS_PROJECT_ID }}
          configurationId=${{ env.TMS_CONFIGURATION_ID }}
          testRunId=${{ env.TMS_TEST_RUN_ID }}
          adapterMode=${{ env.TMS_ADAPTER_MODE }}
          certValidation=${{ env.TMS_CERT_VALIDATION }}
          EOF
          xcodebuild test \
            -project examples-swift.xcodeproj \
            -scheme tests \
            -destination 'platform=macOS' \
            -derivedDataPath "${DERIVED_DATA_PATH}" || true

          sleep 1

          curl -v http://127.0.0.1:49152/health || true
          
          curl -v http://127.0.0.1:49152/wait-completion?testRunId=${{ env.TMS_TEST_RUN_ID }} || true
          
          cat ../service.log
          
      - name: Validate
        run: |
          dotnet test --configuration Debug --no-build --logger:"console;verbosity=detailed" api-validator-dotnet

      - name: Test Adapter Mode 2
        env:
          DERIVED_DATA_PATH: ${{ github.workspace }}/.derivedData
        run: |
          cd swift-examples
          
          cat > tests/testit.properties << EOF
          url=${{ env.TMS_URL }}
          privateToken=${{ env.TMS_PRIVATE_TOKEN }}
          projectId=${{ env.TMS_PROJECT_ID }}
          configurationId=${{ env.TMS_CONFIGURATION_ID }}
          adapterMode=2
          certValidation=${{ env.TMS_CERT_VALIDATION }}
          EOF
          xcodebuild test \
            -project examples-swift.xcodeproj \
            -scheme tests \
            -destination 'platform=macOS' \
            -derivedDataPath "${DERIVED_DATA_PATH}" || true

          curl -v http://127.0.0.1:49152/wait-completion || true

      - name: Validate Again
        run: |
          export TMS_TEST_RUN_ID=skip
          dotnet test --configuration Debug --no-build --logger:"console;verbosity=detailed" api-validator-dotnet
